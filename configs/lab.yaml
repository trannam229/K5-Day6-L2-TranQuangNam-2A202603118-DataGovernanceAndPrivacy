# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G01                     # e.g. G07
owner: "Trần Quang Nam (Lead / Integrator)"   # mandatory for every Decision
track_config: tracks/t14.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t14                        # must match track_config
input: fixtures/t14_auto_annotation  # or data/real/... if your instructor provided a real pack
output: out/
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
params:
  conf_threshold: 0.25
  budget: 30
  class_conf_threshold: {car: 0.40, pedestrian: 0.40, motorbike: 0.40, sign: 0.40}
  small_area: 150
  small_classes: [sign, motorbike]
  small_conf_threshold: 0.25
  score_weights: {margin: 0.45, overlap: 0.30, small: 0.25}
